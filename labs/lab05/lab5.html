<!DOCTYPE html>
<html lang="en">

<head>
   <title>Lab 5</title>
   <meta charset="UTF-8" />
   <link href="lab5.css" rel="stylesheet" type="text/css" />
   <script type="text/javascript" src="lab5.js"></script>
</head>

<body>
   <div id="bodyBlock">
      <h1>Intro to IT - Lab 5</h1>
      <p>Olivia Lee</p>
      <form id="addForm" name="addForm" action="#" method="post" onsubmit="return validate(this);">
         <fieldset>
            <legend>Contact Information</legend>
            <div class="formData">

               <label class="field">First Name:</label>
               <div class="value"  onclick = "javascript:recolor(firstName)"><input type="text" size="60" value="" name="firstName" id="firstName" /></div>

               <label class="field">Last Name:</label>
               <div class="value" onclick = "javascript:recolor(lastName)"><input type="text" size="60" value="" name="lastName" id="lastName" /></div>

               <label class="field">Title:</label>
               <div class="value" onclick = "javascript:recolor(title)"><input type="text" size="60" value="" name="title" id="title" /></div>

               <label class="field">Organization:</label>
               <div class="value" onclick = "javascript:recolor(org)"><input type="text" size="60" value="" name="org" id="org" /></div>

               <label class="field">Nickname:</label>
               <div class="value" onclick = "javascript:recolor(pseudonym)"><input type="text" size="60" value="" name="pseudonym" id="pseudonym" /></div>

               <label class="field" >Comments:</label>
               <div class="value" onclick = "javascript:recolor(comments)"><textarea rows="4" cols="40" name="comments"
                     id="comments" onclick = "javascript:rewrite()">Please enter your comments</textarea></div>

               <input type="submit" value="save" id="save" name="save" />
            </div>
         </fieldset>
         <!-- <button type = "button" onclick = "alert(firstName + lastName + 'is' + nickname);">
            Click me
         </button> -->
         <!-- <input type="submit" value="Click me"/> -->
      </form>
   </div>
</body>

</html>
